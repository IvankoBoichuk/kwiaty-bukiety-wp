name: Tests

# Superseded by the Woodpecker pipeline (.woodpecker/ci.yaml), which runs
# pint, pest and the theme typecheck on every push and pull request. The
# automatic triggers are removed so the same suite does not run twice; this
# workflow is kept as a manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test