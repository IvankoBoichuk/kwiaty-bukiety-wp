name: Dev Version Bump

# The bump lands in the PR rather than after the merge. A merge into dev is
# itself a push, so Woodpecker starts deploying the moment the PR closes: a
# bump committed afterwards pushed a second commit, which triggered a second
# pipeline, and the first one had already shipped the pre-bump version while
# both raced to rsync --delete the same target. Bumping here means the merge
# commit already carries the version and one push deploys it once.
#
# The pull_request trigger is removed: no GitHub Actions workflow in this repo
# fires on its own any more. Nothing supplies an event payload to a manual run,
# so the PR is named as an input and its refs are read from the API instead.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to bump
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bump-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      # Stands in for github.event.pull_request, which a manual run does not
      # have. gh is preinstalled on the runner and needs no checkout.
      - name: Read pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" \
            --jq '"head_ref=\(.head.ref)", "base_ref=\(.base.ref)", "head_repo=\(.head.repo.full_name)"' \
            >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN cannot push to a fork's head branch, so the bump would only
      # fail at the last step. The pull_request trigger skipped such PRs
      # silently; a hand-started run was asked for explicitly, so say why not.
      - name: Check the branch can be pushed to
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        run: |
          if [ "${HEAD_REPO}" != "${{ github.repository }}" ]; then
            echo "PR #${{ inputs.pr_number }} is from the fork ${HEAD_REPO}; GITHUB_TOKEN cannot push the bump to its branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only two files are edited and the next version is read from the API, so
      # this job needs no PHP, Composer or Bun. Lint, tests, typecheck and the
      # asset build already gate this PR in .woodpecker/ci.yaml.
      - name: Calculate next version and update files
        run: node .github/scripts/bump-dev-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}

      - name: Commit version changes
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json web/app/themes/sage/style.css

          if git diff --cached --quiet; then
            echo 'Version already matches the calculated one; nothing to commit.'
            exit 0
          fi

          git commit -m "chore(release): bump dev version"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
